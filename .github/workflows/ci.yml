name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]  # Node 18 llegó a EOL en abril 2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm install (no npm ci) para que los overrides de seguridad del
      # package.json se apliquen al resolver el árbol de dependencias.
      - name: Instalar dependencias
        run: npm install --no-audit

      - name: Verificar sintaxis del servidor y los servicios
        run: |
          node --check server.js
          for f in services/*.js config/*.js; do node --check "$f"; done

      - name: Ejecutar pruebas
        run: npm test
        env:
          # Las pruebas nunca contactan servicios externos: tests/helpers/entorno.js
          # vacía las credenciales y apunta los archivos de datos a una carpeta temporal.
          NODE_ENV: test

  audit:
    name: Auditoría de dependencias (producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar resolviendo overrides de seguridad
        run: npm install

      # node-cron/uuid requiere --force (breaking change); || true evita que
      # este step aborte el job antes de llegar a la verificación final.
      - name: Aplicar correcciones no disruptivas
        run: npm audit fix --omit=dev || true

      # Falla solo si quedan vulnerabilidades críticas sin corrección.
      - name: Verificar ausencia de vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

  infra:
    name: Infra — validación OpenTofu + Checkov
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.commits.*.modified), 'infra/') ||
      contains(toJson(github.event.commits.*.added), 'infra/') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: tofu fmt — verificar formato
        working-directory: infra/aws
        run: tofu fmt -check -recursive

      - name: tofu validate — nonprod (sin backend)
        working-directory: infra/aws/envs/nonprod
        run: |
          tofu init -backend=false
          tofu validate

      - name: Instalar Checkov
        run: pip install checkov

      - name: Checkov — análisis de seguridad
        working-directory: infra/aws
        run: |
          checkov \
            --directory . \
            --config-file .checkov.yaml \
            --output cli \
            --output junitxml \
            --output-file-path . \
            --soft-fail false
        continue-on-error: false

      - name: Publicar resultados Checkov
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results-${{ github.run_id }}
          path: infra/aws/results_junitxml.xml
          retention-days: 30
